name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.20.0, 26.7.0]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use verified npm
        run: npm install --global npm@11.19.0
      - name: Install from lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run ordinary tests (shard 1 of 4)
        run: npm run test -- --shard=1/4
      - name: Diagnose shard 2 - command runner
        run: npm exec -- vitest run tests/adapters/command-runner.test.ts
      - name: Diagnose shard 2 - Git adapter
        run: npm exec -- vitest run tests/adapters/git.test.ts
      - name: Diagnose shard 2 - canonical path
        run: npm exec -- vitest run tests/domain/canonical-path.test.ts
      - name: Diagnose shard 2 - SQLite memory store
        run: npm exec -- vitest run tests/memory/local-sqlite-memory-store.test.ts
      - name: Diagnose shard 2 - Skill registry
        run: npm exec -- vitest run tests/skills/registry.test.ts
      - name: Diagnose shard 2 - environment router
        run: npm exec -- vitest run tests/routing/environment-router.test.ts
      - name: Diagnose shard 2 - override parser
        run: npm exec -- vitest run tests/routing/override-parser.test.ts
      - name: Diagnose shard 2 - handoff service
        run: npm exec -- vitest run tests/handoff/handoff-service.test.ts
      - name: Run ordinary tests (shard 3 of 4)
        run: npm run test -- --shard=3/4
      - name: Run ordinary tests (shard 4 of 4)
        run: npm run test -- --shard=4/4
      - name: Validate repository structure
        run: npm run health-check:structural

  integration:
    name: Integration (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.20.0, 26.7.0]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use verified npm
        run: npm install --global npm@11.19.0
      - name: Install from lockfile
        run: npm ci
      - name: Verify node:sqlite
        run: node --input-type=module -e "import { DatabaseSync } from 'node:sqlite'; const database = new DatabaseSync(':memory:'); database.exec('SELECT 1'); database.close();"
      - name: Run serial integration tests
        run: npm run test:integration
