name: Linux descendant cleanup diagnostic

on:
  push:
    branches:
      - codex/linux-descendant-cleanup-stabilization-20260903
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of repeated Linux cleanup observations"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
      - name: Use verified npm
        run: npm install --global npm@11.19.0
      - name: Install from lockfile
        run: npm ci
      - name: Run tagged diagnostic
        env:
          DAI_LINUX_DESCENDANT_DIAGNOSTIC: "1"
          DAI_LINUX_DESCENDANT_ITERATIONS: ${{ inputs.iterations }}
          DAI_LINUX_DESCENDANT_OUTPUT: diagnostic-output.jsonl
        run: npx vitest run tests/adapters/command-runner-linux-diagnostic.test.ts --reporter=verbose
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-descendant-cleanup-diagnostic-${{ github.run_id }}
          path: diagnostic-output.jsonl
          if-no-files-found: error
