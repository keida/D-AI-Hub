name: Linux descendant cleanup diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
      - name: Use verified npm
        run: npm install --global npm@11.19.0
      - name: Install from lockfile
        run: npm ci
      - name: Run 30-run diagnostic
        run: npx vitest run --config diagnostics/vitest.config.ts --reporter=verbose
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-descendant-cleanup-diagnostic-${{ github.run_id }}
          path: diagnostic-artifacts/
          if-no-files-found: error
